name: Build Desktop (Windows & macOS)

# 只构建 Windows + macOS 桌面端（Wails），不上 Linux、不改 Homebrew Formula。
# 与 release-lite.yml 的差异：
#   1. 构建前端并落入 web/，随包分发（Lite 后端从 ./web 提供 SPA，见 internal/router/static.go）
#   2. macOS 打包补齐 web/ + config/ + migrations/sqlite/ + .env，并做 ad-hoc 签名
#   3. Windows 安装包在 project.nsi 中内置同样的运行时资源，另附便携版 zip
#   4. 可选：构建完成后创建 GitHub Release（tag 前缀 desktop-）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v0.8.2），留空则读取 VERSION 文件"
        required: false
        default: ""
        type: string
      publish_release:
        description: "构建完成后创建 GitHub Release"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: build-desktop-win-mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── 1. 前端构建一次，各平台复用 ──
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 2. 桌面端构建（Windows / macOS）──
  build-desktop:
    name: ${{ matrix.arch_label }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/universal
            arch_label: macOS_universal
            artifact_name: desktop-macos-universal
          - os: macos-14
            platform: darwin/arm64
            arch_label: macOS_arm64
            artifact_name: desktop-macos-arm64
          - os: macos-14
            platform: darwin/amd64
            arch_label: macOS_amd64
            artifact_name: desktop-macos-amd64
          - os: windows-latest
            platform: windows/amd64
            arch_label: windows_amd64
            artifact_name: desktop-windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Stage frontend into web/
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building ${V} for ${{ matrix.platform }}"

      - name: Pre-compile Go packages (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          export CGO_CFLAGS="-Wno-deprecated-declarations"
          cd cmd/desktop
          go build -p 1 -buildvcs=false -tags "desktop,sqlite_fts5,production" -o _prebuild_tmp.exe . || true
          rm -f _prebuild_tmp.exe

      - name: Build desktop app
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations"

          BUILD_TAGS="sqlite_fts5"
          NSIS_FLAG=""

          if [ "${{ runner.os }}" = "macOS" ]; then
            export CGO_LDFLAGS="-Wl,-no_warn_duplicate_libraries"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            NSIS_FLAG="-nsis"
          fi

          test -f web/index.html || { echo "web/index.html missing"; exit 1; }
          bash ./scripts/check-license-bundle.sh

          cd cmd/desktop
          wails build -clean \
            -tags "${BUILD_TAGS}" \
            -platform "${{ matrix.platform }}" \
            ${NSIS_FLAG} \
            -ldflags="${LDFLAGS}" \
            -o "WeKnora Lite"

      # ── macOS: 补运行时资源 -> ad-hoc 签名 -> DMG ──
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          set -e
          APP_BUNDLE="WeKnora Lite.app"
          SRC="cmd/desktop/build/bin/${APP_BUNDLE}"
          RESOURCES="${SRC}/Contents/Resources"

          mkdir -p "${RESOURCES}/config"
          mkdir -p "${RESOURCES}/migrations/sqlite"
          bash ./scripts/copy-licenses.sh "${RESOURCES}"

          cp .env.lite.example "${RESOURCES}/.env"
          cp -r migrations/sqlite/* "${RESOURCES}/migrations/sqlite/"
          cp -r config/* "${RESOURCES}/config/"
          rm -rf "${RESOURCES}/web"
          cp -r web "${RESOURCES}/web"

          # ad-hoc 签名：Apple Silicon 上未签名会直接报「已损坏」
          codesign --force --deep --sign - "${SRC}" || echo "ad-hoc codesign skipped"

          DMG_NAME="WeKnora-Lite-App_${{ steps.ver.outputs.version }}_${{ matrix.arch_label }}"
          rm -rf dmg_staging
          mkdir -p dmg_staging
          cp -R "${SRC}" dmg_staging/
          ln -s /Applications dmg_staging/Applications

          hdiutil create -volname "WeKnora Lite" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "${DMG_NAME}.dmg"

          shasum -a 256 "${DMG_NAME}.dmg" > "${DMG_NAME}.dmg.sha256"

      # ── Windows: NSIS 安装包 + 便携版 zip ──
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          ARCHIVE="WeKnora-Lite-App_${{ steps.ver.outputs.version }}_${{ matrix.arch_label }}"
          INSTALLER="cmd/desktop/build/bin/WeKnora Lite-amd64-installer.exe"
          test -f "${INSTALLER}"
          cp "${INSTALLER}" "${ARCHIVE}_setup.exe"
          sha256sum "${ARCHIVE}_setup.exe" > "${ARCHIVE}_setup.exe.sha256"

          PORTABLE="${ARCHIVE}_portable"
          rm -rf "${PORTABLE}"
          mkdir -p "${PORTABLE}"
          cp "cmd/desktop/build/bin/WeKnora Lite.exe" "${PORTABLE}/"
          bash ./scripts/copy-licenses.sh "${PORTABLE}"
          cp .env.lite.example "${PORTABLE}/.env"
          cp -r web "${PORTABLE}/web"
          cp -r config "${PORTABLE}/config"
          mkdir -p "${PORTABLE}/migrations/sqlite"
          cp -r migrations/sqlite/* "${PORTABLE}/migrations/sqlite/"

          powershell -NoProfile -Command "Compress-Archive -Path '${PORTABLE}' -DestinationPath '${ARCHIVE}_portable.zip' -Force"
          sha256sum "${ARCHIVE}_portable.zip" > "${ARCHIVE}_portable.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: WeKnora-Lite-App_*
          retention-days: 3

  # ── 3. 可选：发布 Release ──
  release:
    name: Publish release
    needs: build-desktop
    if: ${{ inputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Show assets
        run: ls -lh WeKnora-Lite-App_* || true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="desktop-${{ steps.ver.outputs.version }}"
          cat > notes.md << 'NOTES'
          ## WeKnora Desktop ${{ steps.ver.outputs.version }}

          Wails 桌面版，内置 Web 服务与 SQLite，开箱即用。

          | 文件 | 平台 |
          |------|------|
          | `WeKnora-Lite-App_*_macOS_universal.dmg` | macOS（Intel + Apple Silicon 通用） |
          | `WeKnora-Lite-App_*_macOS_arm64.dmg` | macOS Apple Silicon |
          | `WeKnora-Lite-App_*_macOS_amd64.dmg` | macOS Intel |
          | `WeKnora-Lite-App_*_windows_amd64_setup.exe` | Windows x86_64 安装包 |
          | `WeKnora-Lite-App_*_windows_amd64_portable.zip` | Windows x86_64 免安装版 |

          首次打开若被系统拦截：macOS 右键「打开」，或执行
          `xattr -dr com.apple.quarantine "/Applications/WeKnora Lite.app"`。
          Windows 若提示 SmartScreen，选择「更多信息 - 仍要运行」。
          NOTES

          gh release create "${TAG}" \
            --title "WeKnora Desktop ${{ steps.ver.outputs.version }}" \
            --notes-file notes.md \
            WeKnora-Lite-App_* 2>/dev/null \
          || gh release upload "${TAG}" WeKnora-Lite-App_* --clobber
